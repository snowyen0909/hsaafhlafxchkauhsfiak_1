name: Build iOS (unsigned IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      edition:
        description: 'all = 三个版本；mod = 只编时装柜 Mod 版'
        required: false
        default: all

# IPAs go to the GitHub Release "ipa-latest" (Releases page), not to Actions artifacts:
# release files don't count against the 2 GB Actions storage quota.
permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  RELEASE_TAG: ipa-latest

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "最新 IPA" --notes "自动编译的最新未签名 IPA（每次编译覆盖）" --prerelease

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          # .NET for iOS 26.5 (workload set 10.0.401) needs Xcode 26.6
          XC=/Applications/Xcode_26.6.app
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install iOS workload
        run: dotnet workload install ios --version 10.0.401

      - name: Build libopenmpt (MO3 music)
        continue-on-error: true
        run: tools/build_libopenmpt_ios.sh

      - name: Build (no-comic edition)
        if: inputs.edition != 'mod'
        shell: bash -eo pipefail {0}
        run: dotnet build src/Lawn_iOS/Lawn_iOS.csproj -c Release -p:BuildIpa=false 2>&1 | tee build.log

      - name: Package no-comic IPA
        if: inputs.edition != 'mod'
        run: tools/package_ipa.sh PVZ-iOS-unsigned.ipa

      - name: Publish PVZ-iOS-unsigned.ipa
        if: inputs.edition != 'mod'
        run: |
          gh release upload "$RELEASE_TAG" PVZ-iOS-unsigned.ipa --clobber
          gh release edit "$RELEASE_TAG" --notes "自动编译的最新未签名 IPA（每次编译覆盖）。最近一次：${GITHUB_SHA::7} $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Build (comic edition)
        if: inputs.edition != 'mod' && hashFiles('ContentComic/images/600x1000/*.xnb') != ''
        shell: bash -eo pipefail {0}
        run: dotnet build src/Lawn_iOS/Lawn_iOS.csproj -c Release -p:BuildIpa=false -p:Comic=true 2>&1 | tee build-comic.log

      - name: Package comic IPA
        if: inputs.edition != 'mod' && hashFiles('ContentComic/images/600x1000/*.xnb') != ''
        run: tools/package_ipa.sh PVZ-iOS-Comic-unsigned.ipa

      - name: Publish PVZ-iOS-Comic-unsigned.ipa
        if: inputs.edition != 'mod' && hashFiles('ContentComic/images/600x1000/*.xnb') != ''
        run: |
          gh release upload "$RELEASE_TAG" PVZ-iOS-Comic-unsigned.ipa --clobber
          gh release edit "$RELEASE_TAG" --notes "自动编译的最新未签名 IPA（每次编译覆盖）。最近一次：${GITHUB_SHA::7} $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Build (wardrobe mod edition)
        shell: bash -eo pipefail {0}
        run: |
          rm -rf src/Lawn_iOS/bin/Release src/Lawn_iOS/obj/Release
          dotnet build src/Lawn_iOS/Lawn_iOS.csproj -c Release -p:BuildIpa=false -p:Mod=true 2>&1 | tee build-mod.log

      - name: Package mod IPA
        run: tools/package_ipa.sh PVZ-iOS-Mod-unsigned.ipa

      - name: Publish PVZ-iOS-Mod-unsigned.ipa
        run: |
          gh release upload "$RELEASE_TAG" PVZ-iOS-Mod-unsigned.ipa --clobber
          gh release edit "$RELEASE_TAG" --notes "自动编译的最新未签名 IPA（每次编译覆盖）。最近一次：${GITHUB_SHA::7} $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Show build errors
        if: failure()
        run: grep -h -E "error [A-Z]+[0-9]+" build*.log | sort -u | head -50 || true
