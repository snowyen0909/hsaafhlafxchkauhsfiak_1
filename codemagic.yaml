# Codemagic (https://codemagic.io) builds — free plan: 500 macOS M2 minutes / month for personal accounts.
# Start a build from the Codemagic dashboard and pick the workflow:
#   ios-mod    : 时装柜 Mod 版 only (fastest)
#   ios-normal : 一般版 only
#   ios-comic  : 漫画版 only
#   ios-all    : all three
# No signing: produces unsigned .ipa files (same as the GitHub Actions workflow).

definitions:
  environment: &env
    vars:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    xcode: latest            # .NET iOS workload 10.0.401 needs Xcode >= 26.6
  steps:
  - &dotnet
    name: Install .NET 10 + iOS workload
    script: |
      curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
      bash dotnet-install.sh --channel 10.0 --install-dir "$HOME/.dotnet"
      echo "PATH=$HOME/.dotnet:$PATH" >> $CM_ENV
      echo "DOTNET_ROOT=$HOME/.dotnet" >> $CM_ENV
      export PATH="$HOME/.dotnet:$PATH" DOTNET_ROOT="$HOME/.dotnet"
      xcodebuild -version
      dotnet workload install ios --version 10.0.401
  - &openmpt
    name: Build libopenmpt (MO3 music)
    script: tools/build_libopenmpt_ios.sh || echo "libopenmpt skipped"
  - &normal
    name: Build 一般版
    script: |
      dotnet build src/Lawn_iOS/Lawn_iOS.csproj -c Release -p:BuildIpa=false
      tools/package_ipa.sh PVZ-iOS-unsigned.ipa
  - &comic
    name: Build 漫画版
    script: |
      rm -rf src/Lawn_iOS/bin/Release src/Lawn_iOS/obj/Release
      dotnet build src/Lawn_iOS/Lawn_iOS.csproj -c Release -p:BuildIpa=false -p:Comic=true
      tools/package_ipa.sh PVZ-iOS-Comic-unsigned.ipa
  - &mod
    name: Build 时装柜 Mod 版
    script: |
      rm -rf src/Lawn_iOS/bin/Release src/Lawn_iOS/obj/Release
      dotnet build src/Lawn_iOS/Lawn_iOS.csproj -c Release -p:BuildIpa=false -p:Mod=true
      tools/package_ipa.sh PVZ-iOS-Mod-unsigned.ipa

workflows:
  ios-mod:
    name: iOS 时装柜 Mod 版
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment: *env
    scripts:
      - *dotnet
      - *openmpt
      - *mod
    artifacts:
      - "*.ipa"

  ios-normal:
    name: iOS 一般版
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment: *env
    scripts:
      - *dotnet
      - *openmpt
      - *normal
    artifacts:
      - "*.ipa"

  ios-comic:
    name: iOS 漫画版
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment: *env
    scripts:
      - *dotnet
      - *openmpt
      - *comic
    artifacts:
      - "*.ipa"

  ios-all:
    name: iOS 全部三个版本
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment: *env
    scripts:
      - *dotnet
      - *openmpt
      - *normal
      - *comic
      - *mod
    artifacts:
      - "*.ipa"
